name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v5.1.0
        with:
          path: node_modules
          key: bun-nm-v2-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Disable bunfig preload
        run: sed -i 's/^preload = \["bun-plugin-stx"\]/# preload = ["bun-plugin-stx"]/' bunfig.toml

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v5.1.0
        with:
          path: node_modules
          key: bun-nm-v2-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Disable bunfig preload
        run: sed -i 's/^preload = \["bun-plugin-stx"\]/# preload = ["bun-plugin-stx"]/' bunfig.toml

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v5.1.0
        with:
          path: node_modules
          key: bun-nm-v2-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Disable bunfig preload
        run: sed -i 's/^preload = \["bun-plugin-stx"\]/# preload = ["bun-plugin-stx"]/' bunfig.toml

      - name: Unit Test
        run: bun test --timeout 30000 --bail

  publish-commit:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit '.' && pantry publish:commit './packages/error-sdk'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
