name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.1.3

      - name: Use cached node_modules
        uses: actions/cache@v5.0.3
        with:
          path: node_modules
          key: bun-nm-v2-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Disable bunfig preload
        run: sed -i 's/^preload = \["bun-plugin-stx"\]/# preload = ["bun-plugin-stx"]/' bunfig.toml

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.1.3

      - name: Use cached node_modules
        uses: actions/cache@v5.0.3
        with:
          path: node_modules
          key: bun-nm-v2-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Disable bunfig preload
        run: sed -i 's/^preload = \["bun-plugin-stx"\]/# preload = ["bun-plugin-stx"]/' bunfig.toml

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.1.3

      - name: Use cached node_modules
        uses: actions/cache@v5.0.3
        with:
          path: node_modules
          key: bun-nm-v2-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Disable bunfig preload
        run: sed -i 's/^preload = \["bun-plugin-stx"\]/# preload = ["bun-plugin-stx"]/' bunfig.toml

      - name: Unit Test
        run: bun test
